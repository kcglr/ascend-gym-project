# Builds the installable web app and publishes it on GitHub Pages.
# A push to main deploys. A pull request only runs the rule tests and the build, so a break shows before a merge.
# In the repository settings, Pages has to use "GitHub Actions" as its source.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the build takes the date of the app's last change from the history
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Rule tests
        run: node tests/engine.test.js
      - name: Build
        run: node build.js
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
